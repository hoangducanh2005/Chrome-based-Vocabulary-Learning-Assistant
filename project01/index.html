<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast - Ứng dụng thời tiết</title>
    <meta name="description" content="Xem dự báo thời tiết thời gian thực với SkyCast. Thiết kế hiện đại, dữ liệu chính xác.">
    <link rel="stylesheet" href="style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main class="weather-container">
        <header class="search-box">
            <div class="input-wrapper">
                <input type="text" id="city-input" placeholder="Nhập tên thành phố..." autocomplete="off">
                <button id="clear-btn" aria-label="Xóa" class="clear-btn">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <button id="search-btn" aria-label="Tìm kiếm">
                <i data-lucide="search"></i>
                <div class="loading-spinner" id="spinner"></div>
            </button>
        </header>

        <section class="weather-main" id="weather-content">
            <div class="weather-icon" id="main-icon">
                <i data-lucide="sun" size="80"></i>
            </div>
            <h1 class="temp" id="temp">--°C</h1>
            <h2 class="location" id="location">Tìm kiếm thành phố</h2>
            <p class="description" id="description">Dữ liệu thời tiết thời gian thực</p>
        </section>

        <footer class="weather-details">
            <div class="detail-item">
                <i data-lucide="droplets"></i>
                <div class="detail-info">
                    <p>Độ ẩm</p>
                    <p id="humidity">--%</p>
                </div>
            </div>
            <div class="detail-item">
                <i data-lucide="wind"></i>
                <div class="detail-info">
                    <p>Tốc độ gió</p>
                    <p id="wind">-- km/h</p>
                </div>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
